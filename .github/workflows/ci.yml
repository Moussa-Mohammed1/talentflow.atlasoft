name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  backend:
    name: Backend Lint & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: talentflow
          POSTGRES_PASSWORD: talentflow_ci_password
          POSTGRES_DB: talentflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ruff lint on hardened Phase 1 & Phase 2 modules & tests
        run: >
          ruff check
          app/main.py
          app/core
          app/api/router.py
          app/api/routes/health.py
          app/api/routes/files.py
          app/api/routes/job.py
          app/api/routes/matching.py
          app/models/job.py
          app/models/embeddings.py
          app/schemas/job.py
          app/schemas/cv_pipeline.py
          app/schemas/matching.py
          app/repositories/job_repository.py
          app/services/job_service.py
          app/services/storage
          app/services/resume_extraction
          app/services/cv_pipeline
          app/services/embeddings
          app/services/matching
          app/services/notification_manager.py
          app/workers
          tests

      - name: Run backend tests
        env:
          ENVIRONMENT: test
          DATABASE_URL: postgresql+psycopg://talentflow:talentflow_ci_password@localhost:5432/talentflow_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ci-test-secret-key-at-least-32-characters-long
          EMAIL_SUFFIX: "@example.com"
          FRONTEND_URL: http://localhost:3000
        run: |
          alembic upgrade head
          pytest -v tests

  frontend:
    name: Frontend Typecheck, Tests & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck TypeScript
        run: npx tsc --noEmit

      - name: Run ESLint on standardized modules
        run: >
          npx eslint
          lib/api-error.ts
          lib/media.ts
          lib/axios.ts
          lib/auth.ts
          lib/query-client.ts
          lib/query-keys.ts
          stores/auth.store.ts
          stores/job.store.ts
          components/providers/QueryProvider.tsx
          components/auth/SessionProvider.tsx
          components/auth/LoginForm.tsx
          components/ui/SystemJobs.tsx
          hooks/useAuth.ts
          hooks/useNotifications.ts
          hooks/useJobs.ts
          hooks/useResumeImport.ts
          hooks/queries/useAppQueries.ts
          services/auth.service.ts
          services/notification.service.ts
          services/job.service.ts
          services/resume.service.ts
          services/job-offers.service.ts
          types/job.ts
          types/notification.ts
          app/layout.tsx
          app/jobs/page.tsx
          __tests__/api-and-media.test.ts
          __tests__/job-store.test.ts

      - name: Run Vitest unit tests
        run: npm test

      - name: Build Next.js production bundle
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000/api
          NEXT_PUBLIC_WS_URL: ws://localhost:8000
          NEXT_PUBLIC_LINKEDIN_LOGIN_URL: http://localhost:8000/api/auth/linkedin/login
          NEXT_PUBLIC_STORAGE_URL: http://localhost:8000/api/files/
        run: npm run build

  docker:
    name: Docker Compose Validation
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose config --quiet
